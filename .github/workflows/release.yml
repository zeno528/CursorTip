# CursorTip 发行构建：VERSION.ahk 变更时自动触发（paths 按整个 push 的 two-dot diff 判定，
# bump 混在多 commit push 里也不会漏），手动 Run workflow 作为逃逸通道
# 流程：bump VERSION.ahk → push main → build-release (windows, 编译 + Draft)
#   tag = vX.Y.Z 由 VERSION.ahk 推导（单一真源，CursorTip.ahk #Include 它，exe 内版本同源），
#   --target 钉死在本次构建的 SHA，不存在 tag/版本号错位的可能
# Draft 模式下更新日志由「生成 Release body」步骤自动从 git history 提取（上个 tag..HEAD、
# 只看 CursorTip.ahk、按 commit 前缀分类），AI 无需手写：gh release view 审阅 → gh release edit --draft=false 发布。
# 注意：tag 已存在时 gh 会报错；想重发同版本需先删 Release + tag。
name: Release

on:
  push:
    branches: [main]
    paths:
      - 'VERSION.ahk'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # paths 过滤已保证只有 VERSION.ahk 变更的 push 才进得来，无需再 diff 守门
  build-release:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      # fetch-depth: 0 = 完整历史 + 全部 tag：更新日志要 git describe 上个 tag、git log 提取 commit
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 读取版本号（单一真源：VERSION.ahk，CursorTip.ahk #Include 它）
        shell: pwsh
        run: |
          $m = Select-String -Path 'VERSION.ahk' -Pattern 'global VERSION := "(\d+\.\d+\.\d+)"'
          if (-not $m) {
            Write-Error '::error::VERSION.ahk 里找不到 VERSION 行'
            exit 1
          }
          $ver = $m.Matches[0].Groups[1].Value
          "VERSION=$ver" >> $env:GITHUB_ENV
          "脚本版本号: $ver"

      # AHK v2 zip 只含运行时（AutoHotkey64.exe）；Ahk2Exe 在 AutoHotkey/Ahk2Exe 仓库单独发行
      # （v2 安装器/zip 均不附带，靠 UX\install-ahk2exe.ahk 按需下载——在无桌面 CI 上不可用）。
      # 必须用 release 资产里的**编译版** Ahk2Exe.zip（单文件 Ahk2Exe.exe）；
      # tag 源码 zipball 不可用：只有 ~54KB 且为 v1.1 源码，v2 解释器无法运行。
      # 双 zip 直解到同一目录 = 社区通用 CI 配方，绕开一切安装器（官方/UX/choco 安装器均会挂起或装不上）。
      - name: 下载 AutoHotkey v2 + Ahk2Exe（zip 直解，不走安装器）
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'ahk'
          $ahkZip = Join-Path $env:RUNNER_TEMP 'ahk.zip'
          $cplZip = Join-Path $env:RUNNER_TEMP 'ahk2exe.zip'
          curl.exe -sL 'https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.27/AutoHotkey_2.0.27.zip' -o $ahkZip
          curl.exe -sL 'https://github.com/AutoHotkey/Ahk2Exe/releases/download/Ahk2Exe1.1.37.02a2/Ahk2Exe1.1.37.02a2.zip' -o $cplZip
          foreach ($z in @($ahkZip, $cplZip)) {
            if ((Get-Item $z).Length -lt 100KB) { Write-Error "::error::$z 下载不完整"; exit 1 }
          }
          Expand-Archive $ahkZip -DestinationPath $dir -Force
          Expand-Archive $cplZip -DestinationPath $dir -Force
          if (-not (Test-Path "$dir\Ahk2Exe.exe") -or -not (Test-Path "$dir\AutoHotkey64.exe")) {
            Get-ChildItem $dir -Recurse | Select-Object -ExpandProperty FullName
            Write-Error '::error::解压后未找到 Ahk2Exe.exe / AutoHotkey64.exe'
            exit 1
          }
          "AHK2EXE=$dir\Ahk2Exe.exe" >> $env:GITHUB_ENV
          "AHKBASE=$dir\AutoHotkey64.exe" >> $env:GITHUB_ENV
          "AHK v2 就绪: $dir"

      - name: 编译
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $exe = Join-Path (Get-Location) "dist\CursorTip_v$env:VERSION.exe"
          $p = Start-Process -FilePath $env:AHK2EXE -ArgumentList '/silent', 'verbose', '/in', 'CursorTip.ahk', '/out', $exe, '/base', $env:AHKBASE -Wait -PassThru
          "Ahk2Exe exit: $($p.ExitCode)"
          if (-not (Test-Path $exe)) {
            Write-Error '::error::编译失败，未产出 exe'
            exit 1
          }
          "编译产物: $exe ($((Get-Item $exe).Length) bytes)"

      # EXE 名必须保留 CursorTip_v$VERSION.exe 格式：
      # AV 启发式对「通用工具名 + 无签名 AHK 二进制」组合高概率误报，
      # 带版本号的命名模式 (chrome_vXX / office_vXX) 在 ML 模型里风险分极低，零误报。
      - name: 打包 zip（exe + LICENSE）
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\CursorTip_v$env:VERSION.exe", 'LICENSE' -DestinationPath "dist\CursorTip_v$env:VERSION.zip" -Force
          "打包完成: dist\CursorTip_v$env:VERSION.zip"

      # 更新日志自动生成：上个 tag..HEAD，只取改过 CursorTip.ahk 的 commit，按常规提交前缀分类
      # （feat→✨ / fix→🐞 / 其余→🚀；docs/test/ci 不列），subject 尾巴上的版本号 bump 剔除。
      # 分类规则与本地 skill（cursortip-build Step R2）一致，Draft body 即成品，审阅后直接 publish
      - name: 生成 Release body（更新日志从 git history 自动提取）
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8   # git 输出中文 subject 不乱码
          $lastTag = git describe --tags --abbrev=0 2>$null
          $log = ""
          if ($LASTEXITCODE -ne 0 -or -not $lastTag) {
            $log = "维护性更新。`n`n"   # 无 tag 基线时降级占位，不臆造变更范围
          } else {
            "变更范围: $lastTag..HEAD"
            $feat = @(); $fix = @(); $opt = @()
            foreach ($s in (git log "$lastTag..HEAD" --pretty=%s -- CursorTip.ahk)) {
              if (-not $s) { continue }
              # 混在 subject 尾部的版本号 bump 不是用户可见变更（「…并更新版本号至 1.3.7」）
              $t = ($s -replace '并?更新版本号至?\s*v?[\d.]+.*$', '').Trim()
              # bump 独立提交 / 剔尾后只剩类型前缀的纯 bump commit，都不进更新日志
              if (-not $t -or $t -match 'bump version to v?[\d.]+$' -or $t -match '^[a-z]+(\([^)]*\))?!?:\s*$') { continue }
              $m = [regex]::Match($t, '(feat|fix|refactor|perf|style|chore|docs|test|ci)(?:\([^)]*\))?!?:\s*(.+)')
              if ($m.Success) {
                if ($m.Groups[1].Value -in @('docs', 'test', 'ci')) { continue }
                $text = $m.Groups[2].Value.Trim()
                switch ($m.Groups[1].Value) {
                  'feat'  { $feat += $text }
                  'fix'   { $fix  += $text }
                  default { $opt  += $text }   # refactor/perf/style/chore → 优化改进
                }
              } else {
                $opt += $t   # 无规范前缀的提交不丢弃，归入优化改进
              }
            }
            foreach ($g in @(@('✨ 新增功能', $feat), @('🐞 修复问题', $fix), @('🚀 优化改进', $opt))) {
              if ($g[1].Count -gt 0) {
                $log += "### $($g[0])`n" + (($g[1] | ForEach-Object { "- $_" }) -join "`n") + "`n`n"
              }
            }
            if (-not $log) { $log = "维护性更新。`n`n" }
          }
          $draft = @"
          ## 本次更新

          $log
          ## 下载与使用

          首次使用建议下载 `CursorTip_v$env:VERSION.zip`，解压到固定目录，双击 `CursorTip_v$env:VERSION.exe` 运行即可使用。

          > 首次可能被 SmartScreen 拦截，点「更多信息 → 仍要运行」即可（本项目未做代码签名）。
          "@
          Set-Content -Path 'dist\RELEASE_BODY.md' -Value $draft -Encoding UTF8
          "----- Release body 预览 -----"
          Get-Content 'dist\RELEASE_BODY.md'

      - name: 创建 Draft Release（tag 由 VERSION 推导，指向本次构建 SHA）
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "v$env:VERSION"
          gh release create $tag --target $env:GITHUB_SHA --title "CursorTip $tag" --draft --notes-file 'dist\RELEASE_BODY.md' "dist\CursorTip_v$env:VERSION.exe" "dist\CursorTip_v$env:VERSION.zip"
          "已创建 Draft Release $tag（更新日志已自动生成，审阅后 publish，发布后触发 mirror-to-r2）"
