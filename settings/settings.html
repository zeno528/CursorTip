<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>CursorTip Settings</title>
<style>
:root {
  color-scheme: light dark;
  --ink: #202124; --muted: #5e6067; --rail: #f2f2f3; --paper: #fafafa;
  --card: #fff; --line: #dedee2; --accent: #245dbe; --accent-ink: #fff;
  --tint: #ebedf0; --canvas: #f0f0f2; --danger: #a02d43;
  font: 14px/1.5 "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ink: #f1f1f3; --muted: #b1b2b9; --rail: #1b1b1d; --paper: #212123;
    --card: #27272a; --line: #3c3c41; --accent: #a7c7ff; --accent-ink: #122746;
    --tint: #353539; --canvas: #1c1c1f; --danger: #ffb3bd;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); }
button, input, select { font: inherit; color: inherit; }
button, select { cursor: pointer; }
button:disabled { cursor: default; opacity: .47; }
button, select, input { border-radius: 7px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; }
[hidden] { display: none !important; }
svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.shell { height: 100dvh; display: grid; grid-template: minmax(0, 1fr) / 122px minmax(0, 1fr); background: var(--rail); }
.sidebar { padding: 15px 8px 11px; display: flex; flex-direction: column; min-height: 0; }
.brand { display: flex; gap: 5px; align-items: center; margin: 0 3px 17px; }
.brand-mark { display: block; width: 31px; height: 31px; flex: none; }
.wordmark { font-size: 15px; font-weight: 730; letter-spacing: -.035em; }
.tabs { display: grid; gap: 4px; }
.tab { display: flex; gap: 7px; align-items: center; padding: 8px; width: 100%; text-align: left; color: var(--muted); border: 0; background: transparent; font-size: 13px; }
.tab:hover { color: var(--ink); background: var(--paper); }
.tab[aria-selected="true"] { background: var(--tint); color: var(--accent); font-weight: 650; }
.sidebar-footer { margin-top: auto; padding: 18px 4px 0; display: flex; align-items: center; justify-content: space-between; gap: 4px; min-height: 43px; }
.version { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.update-pill { flex: 1; min-width: 0; max-width: 62px; border: 1px solid color-mix(in srgb, var(--accent) 22%, transparent); border-radius: 999px; background: color-mix(in srgb, var(--accent) 13%, var(--rail)); color: var(--accent); padding: 3px 4px; font-size: 11px; font-weight: 650; white-space: nowrap; }
.update-pill:hover:enabled { background: color-mix(in srgb, var(--accent) 21%, var(--rail)); border-color: var(--accent); }
.content { display: grid; grid-template-rows: minmax(0, 1fr); min-width: 0; background: var(--paper); border-left: 1px solid var(--line); border-radius: 14px 0 0 14px; overflow: clip; }
.page { overflow: auto; padding: 15px 13px 12px 18px; }
.page::-webkit-scrollbar { display: none; }
.panel { margin-inline: auto; max-width: 660px; }
h1 { font-size: 23px; line-height: 1.2; margin: 0; letter-spacing: -.025em; font-weight: 700; }
.panel-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h2 { font-size: 12px; margin: 13px 0 5px; color: var(--muted); font-weight: 650; }
.card { border: 1px solid var(--line); border-radius: 9px; background: var(--card); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 9px; padding: 6px 10px; min-height: 39px; }
.card > *:not([hidden]) ~ *:not([hidden]) { border-top: 1px solid var(--line); }
.name { display: inline-flex; align-items: center; gap: 9px; min-width: 0; }
.name svg { color: var(--muted); width: 16px; height: 16px; }
.row.child { position: relative; padding-left: 35px; min-height: 33px; color: var(--muted); }
.row.child::before { content: ""; position: absolute; inset: 0 auto 50% 17px; width: 10px; border: solid var(--muted); border-width: 0 0 1px 1px; border-bottom-left-radius: 4px; opacity: .55; }
.row.child:has(:disabled) { opacity: .6; }
.field { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
.switch { appearance: none; flex: 0 0 auto; width: 34px; height: 20px; border: 1px solid var(--muted); border-radius: 20px; background: var(--rail); margin: 0; cursor: pointer; position: relative; transition: background-color .2s ease, border-color .2s ease; }
.switch::before { content: ""; position: absolute; width: 12px; height: 12px; border-radius: 50%; background: var(--muted); left: 3px; top: 3px; transition: transform .2s ease, background-color .2s ease; }
.switch:checked { background: var(--accent); border-color: var(--accent); }
.switch:checked::before { transform: translateX(14px); background: var(--accent-ink); }
.switch:disabled { cursor: default; }
select { background: var(--paper); border: 1px solid var(--line); padding: 5px 8px; max-width: 100%; }
@supports selector(select:open) {
  select[data-pointer-focus] { outline: none; }
  select:open { outline: 2px solid var(--accent); outline-offset: 0; }
}
.row select { min-width: 130px; }
.stepper { display: inline-flex; align-items: stretch; overflow: hidden; border: 1px solid var(--line); border-radius: 7px; background: var(--paper); }
.stepper button { border: 0; border-radius: 0; background: transparent; width: 26px; min-height: 29px; display: grid; place-items: center; color: var(--muted); }
.stepper button svg { width: 13px; height: 13px; }
.stepper button:hover:enabled, .quiet:hover:enabled { background: var(--tint); color: var(--ink); }
input[type=number] { appearance: textfield; -moz-appearance: textfield; background: var(--paper); border: 1px solid var(--line); padding: 4px 7px; width: 78px; text-align: right; font-variant-numeric: tabular-nums; }
input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { appearance: none; margin: 0; }
.stepper input { border: 0; border-radius: 0; border-inline: 1px solid var(--line); background: transparent; width: 47px; text-align: center; padding-inline: 2px; }
.stepper:focus-within { outline: 2px solid var(--accent); outline-offset: -1px; }
.stepper input:focus-visible { outline: none; }
.stepper button:focus-visible { outline-offset: -2px; }
.field[data-unit="ms"] .stepper input { width: 78px; }
.unit { color: var(--muted); font-size: 12px; min-width: 18px; }
.quiet, .btn { background: transparent; border: 1px solid var(--line); padding: 5px 9px; min-height: 30px; white-space: nowrap; }
.quiet { border-color: transparent; color: var(--muted); }
.btn:hover:enabled { border-color: var(--accent); }
.segments { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; padding: 5px; margin-bottom: 10px; background: var(--rail); border: 1px solid var(--line); border-radius: 10px; }
.segments label { cursor: pointer; position: relative; display: grid; }
.segments input { position: absolute; opacity: 0; }
.segments label > span { display: grid; grid-template-rows: 18px 1fr; justify-items: center; align-items: center; gap: 5px; padding: 8px 3px; border-radius: 6px; color: var(--muted); text-align: center; font-size: 13px; font-weight: 600; }
.segments input:checked + span { background: var(--card); color: var(--accent); box-shadow: 0 1px 2px #0002; }
.segments input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: -2px; }
.sample { position: relative; overflow: hidden; background: #2b2b2f; border: 1px solid var(--line); border-radius: 9px; min-height: 104px; padding: 12px 0; display: grid; place-items: center; }
.sample.dark { background: #f0f0f2; }
.sample::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(#fff .65px, transparent .8px); background-size: 12px 12px; opacity: .18; }
.sample.dark::before { background-image: radial-gradient(var(--muted) .65px, transparent .8px); }
.bubble { position: relative; max-width: 95%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: #f5f5f5; color: #333; border-radius: 8px; padding: 4px 11px; box-shadow: 0 3px 12px #0002; font-family: "Microsoft YaHei", sans-serif; }
.sample.dark .bubble { color: #fff; background: #333; }
.preview-row { display: flex; justify-content: flex-end; margin-top: 8px; }
.status { max-width: 660px; margin: 0 auto 10px; font-size: 12px; color: var(--danger); }
.status:empty { display: none; }
.updates { color: var(--muted); font-size: 12px; display: block; }
.github-mark { display: block; border-radius: 4px; background: #fff; padding: 2px; }
.credits { color: var(--muted); font-size: 12px; }
@media (max-width: 465px) {
  .shell { grid-template-columns: 110px minmax(0, 1fr); }
  .sidebar { padding-inline: 8px; }
  .sidebar-footer { padding-inline: 0; }
  .brand { margin-inline: 2px; gap: 5px; }
  .brand-mark { width: 26px; height: 26px; }
  .wordmark { font-size: 14px; }
  .tab { padding-inline: 6px; gap: 5px; font-size: 12px; }
  .page { padding: 20px 12px 12px; }
  .row { flex-wrap: wrap; gap: 6px; }
  .row .field, .row > select { margin-left: auto; }
  .segments label > span { font-size: 12px; }
}
@media (forced-colors: active) {
  .switch { appearance: auto; }
  .switch::before { display: none; }
  .tab[aria-selected="true"], .segments input:checked + span { outline: 1px solid Highlight; }
}
</style>
</head>

for (const field of $$('[data-number]')) {
  const {number:key, for:label, step, min='0', max, unit} = field.dataset;
  field.innerHTML = '<div class="stepper"><button type="button" data-step="-1"><svg aria-hidden="true"><use href="#minus"/></svg></button>'
    + '<input type="number" aria-labelledby="' + label + '" aria-describedby="' + key + '-unit" min="' + min + '" max="' + max + '" step="' + step + '" data-key="' + key + '">'
    + '<button type="button" data-step="1"><svg aria-hidden="true"><use href="#plus"/></svg></button></div>'
    + '<span class="unit" id="' + key + '-unit">' + unit + '</span>';
}

function translated() {
  const lang = draft.language === 'auto' ? systemLang : draft.language;
  t = words[lang] || words.en;
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  for (const item of $$('[data-i]')) item.textContent = t[item.dataset.i];
  for (const item of $$('[data-label]')) item.setAttribute('aria-label', t[item.dataset.label]);
  $('.tabs').setAttribute('aria-label', lang === 'zh' ? '设置' : 'Settings');
  for (const row of $$('[data-number]')) {
    const label = document.getElementById(row.dataset.for).textContent;
    for (const button of row.querySelectorAll('[data-step]'))
      button.setAttribute('aria-label', label + ' · ' + t[button.dataset.step === '1' ? 'increase' : 'decrease']);
  }
}

function syncControls() {
  for (const control of $$('[data-key]')) {
    const value = draft[control.dataset.key];
    if (control.type === 'checkbox') control.checked = value === '1';
    else if (control.type === 'radio') control.checked = control.value === value;
    else control.value = value;
  }
  render();
}

function normalized(control, fallback) {
  const value = control.valueAsNumber;
  return Number.isFinite(value) ? String(Math.max(+control.min, Math.min(+control.max, Math.round(value)))) : fallback;
}

function payload() {
  return keys.map(key => draft[key]).join('|');
}

function apply() {
  const values = payload();
  if (values !== requested) {
    requested = values;
    saveError = false;
    post('apply|' + values);
  }
  render();
}

function render() {
  $('[data-key="ime"]').disabled = draft.caps !== '1';
  for (const row of $$('[data-position]')) row.hidden = row.dataset.position !== draft.position;
  $('#position-fields').hidden = draft.position === '2';
  for (const row of $$('[data-number]')) {
    const input = row.querySelector('input');
    row.querySelector('[data-step="-1"]').disabled = input.value !== '' && +input.value <= +input.min;
    row.querySelector('[data-step="1"]').disabled = input.value !== '' && +input.value >= +input.max;
  }
  const sample = $('#sample');
  sample.textContent = t.sample;
  sample.style.fontSize = normalized($('[data-key="fontSize"]'), defaults.fontSize) + 'pt';
  sample.style.fontWeight = draft.bold === '1' ? '700' : '400';
  $('.sample').classList.toggle('dark', draft.theme === 'dark' || draft.theme === 'auto' && systemDark.matches);
  $('#error').textContent = saveError ? t.saveError : '';
  renderUpdate();
}

function renderUpdate() {
  const [status, version, progress] = update;
  const available = status === 'available';
  const downloading = status === 'downloading';
  const button = $('#update-btn');
  button.textContent = available || downloading ? t.upgrade : t.check;
  button.disabled = status === 'checking' || downloading;
  $('#update-status').textContent = (t[status] || '') + (available ? ' v' + version : '') +
    (downloading && progress ? ' ' + progress + ' MB' : '');

  const pill = $('#sidebar-update');
  pill.hidden = !available && !downloading;
  pill.disabled = downloading;
  pill.textContent = downloading ? '…' : t.sidebarUpgrade;
  pill.title = downloading ? t.downloading : t.upgrade + ' v' + version;
  pill.setAttribute('aria-label', pill.title);
}

function chooseTab(button, focus = false) {
  for (const tab of $$('[role="tab"]')) {
    const selected = tab === button;
    tab.setAttribute('aria-selected', selected);
    tab.tabIndex = selected ? 0 : -1;
    document.getElementById(tab.getAttribute('aria-controls')).hidden = !selected;
  }
  $('.page').scrollTop = 0;
  if (focus) button.focus();
}

function preview() { post('preview|' + payload()); }
function step(input, direction) {
  const start = Number(normalized(input, defaults[input.dataset.key]));
  input.value = Math.max(+input.min, Math.min(+input.max, start + direction * +input.step));
  commitNumber(input);
}

function commitNumber(input) {
  const key = input.dataset.key;
  input.value = draft[key] = normalized(input, draft[key]);
  apply();
}

function closeSettings() {
  if (document.activeElement.matches('input[type="number"]')) commitNumber(document.activeElement);
  post('close');
}

document.addEventListener('input', ({target}) => {
  if (!target.dataset.key) return;
  if (target.type === 'number') { render(); return; }
  draft[target.dataset.key] = target.type === 'checkbox' ? String(+target.checked) : target.value;
  if (target.dataset.key === 'language') translated();
  apply();
});
document.addEventListener('change', ({target}) => {
  if (target.type === 'number') commitNumber(target);
});
document.addEventListener('pointerdown', ({target, button}) => {
  if (button !== 0) return;
  const control = target.closest('select') || target.closest('label')?.querySelector('select');
  control?.setAttribute('data-pointer-focus', '');
});
document.addEventListener('focusout', ({target}) => {
  if (target.matches('select')) target.removeAttribute('data-pointer-focus');
});
document.addEventListener('keydown', event => {
  if (event.target.matches('select')) event.target.removeAttribute('data-pointer-focus');
  if (event.key === 'Escape') { closeSettings(); return; }
  if (event.key === 'Enter' && event.target.type === 'number') commitNumber(event.target);
  const tab = event.target.closest('[role="tab"]');
  if (tab && ['ArrowDown','ArrowUp','Home','End'].includes(event.key)) {
    event.preventDefault();
    const tabs = $$('[role="tab"]');
    const next = event.key === 'Home' ? 0 : event.key === 'End' ? tabs.length - 1 :
      (tabs.indexOf(tab) + (event.key === 'ArrowDown' ? 1 : tabs.length - 1)) % tabs.length;
    chooseTab(tabs[next], true);
  }
  if (event.target.closest('.stepper') && event.target.type === 'number' && ['ArrowUp','ArrowDown'].includes(event.key)) {
    event.preventDefault();
    step(event.target, event.key === 'ArrowUp' ? 1 : -1);
  }
});
document.addEventListener('click', event => {
  const button = event.target.closest('button');
  if (!button) return;
  if (button.getAttribute('role') === 'tab') { chooseTab(button); return; }
  const {action, step:direction} = button.dataset;
  if (direction) step(button.parentElement.querySelector('input'), +direction);
  if (action === 'reset') {
    for (const {dataset:{key}} of button.closest('.panel').querySelectorAll('[data-key]'))
      draft[key] = defaults[key];
    translated();
    syncControls();
    apply();
  } else if (action === 'preview') preview();
  else if (['check','changelog','repository'].includes(action)) post(action);
});
systemDark.addEventListener('change', () => { if (draft) render(); });

function init(version, lang, current, base) {
  systemLang = lang;
  draft = Object.fromEntries(keys.map((key, i) => [key, current[i]]));
  defaults = Object.fromEntries(keys.map((key, i) => [key, base[i]]));
  $('#version').textContent = $('#about-version').textContent = 'v' + version;
  requested = current.join('|');
  translated();
  syncControls();
  $('#app').hidden = false;
  post('painted');
}
bridge?.addEventListener('message', ({data}) => {
  const [type, ...parts] = data.split('|');
  if (type === 'init') init(parts[0], parts[1], parts.slice(2,19), parts.slice(19,38));
  if (type === 'update') { update = parts; if (t) renderUpdate(); }
  if (type === 'closing') closeSettings();
  if (type === 'apply-unavailable' && parts.join('|') === requested) {
    requested = '';
    saveError = true;
    render();
  }
  if (type === 'apply-error' && parts.slice(0, keys.length).join('|') === requested) {
    const current = parts.slice(keys.length);
    requested = current.join('|');
    draft = Object.fromEntries(keys.map((key, i) => [key, current[i]]));
    saveError = true;
    translated();
    syncControls();
  }
});
post('ready');
</script>
</body>
</html>
